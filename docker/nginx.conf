server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip the text assets; images and fonts are already compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets never change - cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker must never be cached, or the app can never update.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Single-page app: every unknown path is a client route.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
