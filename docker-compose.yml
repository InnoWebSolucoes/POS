services:
  db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pos-db-data:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: pos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${POSTGRES_DB:-pos}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@pos.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin123}
    volumes:
      - pos-uploads:/data/uploads
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        VITE_SOCKET_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    container_name: pos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  # Nightly pg_dump into ./scripts/backup, keeping 14 days.
  backup:
    image: postgres:16-alpine
    container_name: pos-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-pos}
    volumes:
      - ./scripts/backup:/backup
    entrypoint: >
      sh -c "while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        pg_dump -h db -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos} -Fc -f /backup/pos-$$ts.dump || echo 'backup failed';
        find /backup -name 'pos-*.dump' -mtime +14 -delete;
        sleep 86400;
      done"

volumes:
  pos-db-data:
  pos-uploads:
